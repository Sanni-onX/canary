name: Canary checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
      - run: node scripts/forge.mjs install foundry-rs/forge-std@v1.9.7 --no-git
      - run: npm run test:discovery
      - run: npm run test:pq
      - run: npm run test:coverage
      - run: npm run test:ceremony
      - run: npm run test:watcher
      - run: node --import tsx --test services/watcher/test/maintenance.test.mjs
      - run: node --import tsx --test scripts/qorex-transactions.test.ts
      - run: node --import tsx --test scripts/amounts.test.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint:solidity
      - run: python -m venv .local/audit-venv
      - run: .local/audit-venv/bin/pip install -r audit/requirements.txt
      - run: npm run audit:static
      - run: node scripts/forge.mjs fmt --check
      - run: node scripts/forge.mjs test -vv
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
