name: Canary discovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
      - run: node scripts/forge.mjs install foundry-rs/forge-std@v1.9.7 --no-git
      - run: npm run test:discovery
      - run: npm run typecheck
      - run: node scripts/forge.mjs fmt --check
      - run: node scripts/forge.mjs test -vv
